{% extends "accounts/auth_base.html" %}
{% block title %}Check your email{% endblock %}
{% block auth_card %}
<div class="h5-auth-done">
  <div class="h5-empty-ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
  <h1>Check your email</h1>
  <p>If the account exists, a reset link is on its way.</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">Back to log in</a>
</div>
{% endblock %}
