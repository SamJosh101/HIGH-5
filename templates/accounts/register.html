{% extends "accounts/auth_base.html" %}
{% block title %}Sign up{% endblock %}
{% block auth_tagline %}Your seat<br><em>is waiting.</em>{% endblock %}
{% block auth_card %}
<h1>Sign up</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button type="submit" class="btn btn-primary">Create account</button>
</form>
<div class="h5-auth-links">
  <span>Have an account? <a href="{% url 'accounts:login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Log in</a></span>
</div>
{% endblock %}
