{% extends "accounts/auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block auth_tagline %}Welcome<br><em>back.</em>{% endblock %}
{% block auth_card %}
<h1>Log in</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <button type="submit" class="btn btn-primary">Log in</button>
</form>
<div class="h5-auth-links">
  <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
  <span>New here? <a href="{% url 'accounts:register' %}">Sign up</a></span>
</div>
{% endblock %}
