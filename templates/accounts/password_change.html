{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="h5-panel h5-panel-narrow">
  <h1 class="h3 fw-light mb-4">Change password</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary w-100">Save password</button>
  </form>
  <div class="h5-auth-links justify-content-center"><a href="{% url 'accounts:profile' %}">&larr; Back to profile</a></div>
</div>
{% endblock %}
