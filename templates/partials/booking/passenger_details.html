
{% comment %}
  Passenger details form.
  JavaScript generates one passenger form for each selected seat.
  The logged-in user remains the owner of the booking.
{% endcomment %}

<section class="h5-book-panel h5-passenger-panel"
         aria-labelledby="h5PassengerTitle">

    <div class="h5-book-head">
        <h2 id="h5PassengerTitle">Passenger details</h2>
        <span>Who is travelling?</span>
    </div>

    <div id="h5PassengerFields">
        <!-- Passenger forms will be generated by booking.js -->
    </div>

</section>
